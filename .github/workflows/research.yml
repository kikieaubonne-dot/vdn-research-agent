name: VDN Research Agent V5
on:
  schedule:
    - cron: '17 * * * *'     # recherche toutes les heures
    - cron: '23 3 * * *'     # rafraîchissement quotidien : index officiel Roblox + pages de sitemap DevForum
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Rafraîchir aussi les index de sources'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: vdn-research
  cancel-in-progress: false
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # quota de l'API GitHub plus élevé (gratuit)
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests (avant toute écriture)
        run: python -m unittest discover -s tests
      - name: Rafraîchir les index de sources
        if: github.event.schedule == '23 3 * * *' || inputs.refresh
        run: python -m agent.run refresh --devforum-pages 4
      - name: Recherche
        if: github.event.schedule != '23 3 * * *'
        run: python -m agent.run research --max-queries 8 --per-source 4 --max-fetch 30 --pause 1
      - name: Benchmark (rapport ; une régression est signalée sans bloquer la sauvegarde)
        continue-on-error: true
        run: python -m agent.run bench
      - name: Sauvegarder la bibliothèque et l'état
        run: |
          git config user.name 'vdn-research-bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add knowledge/ output/
          if ! git diff --cached --quiet; then
            git commit -m "research: V5 $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi

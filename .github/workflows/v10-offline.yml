name: V10 offline compatibility
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m tests.offline
      - name: Isolated personal configuration permits network
        run: python -m tests.personal_config
